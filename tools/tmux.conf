# tmux config. Bindings mirror tools/wezterm.lua so native WezTerm panes
# and tmux panes behave identically (prefix Ctrl+b).
set -g mouse on
set -g history-limit 100000
set -g focus-events on
setw -g mode-keys vi

# Splits and new windows open in the current pane's directory, like WezTerm.
bind % split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Keep the terminal emulator interchangeable: tmux owns panes and sessions.
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R

bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Ctrl+h/j/k/l: move between panes without the prefix. When the pane runs
# Vim/Neovim the key goes to the editor, which moves between its own splits
# and hands off to tmux at the edge (smart-splits.nvim / tools/vimrc). fzf
# keeps the keys too, for its Ctrl+j/k list navigation.
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"
bind -n C-h if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind -n C-j if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind -n C-k if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind -n C-l if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'

# Match WezTerm: prefix o rotates panes; copy mode selects with v, copies with y.
bind o rotate-window
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
